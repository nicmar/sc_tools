name: Build Release

on:
  # Trigger on version tags
  push:
    tags:
      - 'v*'

  # Allow manual trigger
  workflow_dispatch:

  # Or trigger on release creation
  release:
    types: [created]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
            artifact_name: SpaceChefSaveManager
          - os: windows-latest
            platform: Windows
            artifact_name: SpaceChefSaveManager.exe
          - os: macos-latest
            platform: macOS
            artifact_name: SpaceChefSaveManager

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # Tkinter should be included with Python on GitHub Actions macOS
          python3 -c "import tkinter; print('Tkinter OK')"

      - name: Install Python dependencies
        working-directory: space-chef-save-manager
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable
        working-directory: space-chef-save-manager
        run: |
          python build.py

      - name: Create package
        working-directory: space-chef-save-manager
        run: |
          python package.py

      - name: List dist contents
        working-directory: space-chef-save-manager
        shell: bash
        run: |
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpaceChefSaveManager-${{ matrix.platform }}
          path: space-chef-save-manager/dist/*.zip
          if-no-files-found: error

      - name: Upload to release (if release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: space-chef-save-manager/dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Create a combined artifact with all builds
  combine:
    name: Combine All Builds
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-builds

      - name: Display structure
        run: |
          ls -R all-builds/

      - name: Create combined release package
        run: |
          mkdir -p release
          find all-builds -name "*.zip" -exec cp {} release/ \;
          ls -lh release/

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpaceChefSaveManager-AllPlatforms
          path: release/*.zip
